name: Build Raqeeb (Windows)

# Builds the Raqeeb Windows executable from source on GitHub's servers and
# attaches it to a release. Building on GitHub gives the binary traceable
# provenance, which helps Windows trust it over time.
#
# To sign the binary later (removes the Windows block for users):
#   1. Get a free open-source code-signing certificate from https://signpath.io
#   2. Add the SignPath signing step where indicated below.

on:
  push:
    tags:
      - "v*"          # build on every version tag, e.g. v1.1.0
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: write      # needed to attach the exe to a release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          check-latest: true

      - name: Show Go version
        run: go version

      # The Go build embeds two kinds of helper binaries that are NOT stored in
      # git (they are large and rebuildable): the on-device Android collectors,
      # and Windows adb. We produce them here before building.

      - name: Build Android collector binaries
        shell: bash
        working-directory: android-collector
        run: |
          for arch in arm arm64 amd64 386; do
            GOARM=$( [ "$arch" = arm ] && echo 6 )
            GOOS=linux GOARCH=$arch GOARM=$GOARM go build -ldflags="-s -w" -o ../assets/collector_$arch .
          done
          ls -la ../assets/collector_*

      - name: Fetch Windows adb (platform-tools)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt -Force
          Copy-Item pt/platform-tools/adb.exe            assets/adb.exe
          Copy-Item pt/platform-tools/AdbWinApi.dll      assets/AdbWinApi.dll
          Copy-Item pt/platform-tools/AdbWinUsbApi.dll   assets/AdbWinUsbApi.dll

      - name: Build Raqeeb
        run: go build -o raqeeb-The.muslim.shield.exe .

      # --- Optional: sign the binary so Windows trusts it -------------------
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: <your-signpath-org-id>
      #     project-slug: raqeeb
      #     signing-policy-slug: release-signing
      #     artifact-configuration-slug: exe
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      # ----------------------------------------------------------------------

      - name: Upload build artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: raqeeb-windows
          path: raqeeb-The.muslim.shield.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: raqeeb-The.muslim.shield.exe
          generate_release_notes: true
