name: Build Raqeeb (Windows)

# Builds the Raqeeb Windows executable from source on GitHub's servers.
# Building on GitHub gives the release traceable provenance, which helps
# Windows SmartScreen / Smart App Control trust it over time.
#
# To sign the binary later (removes the Windows block for users):
#   1. Get a free open-source code-signing certificate from https://signpath.io
#   2. Add the SignPath signing step where indicated below.

on:
  push:
    tags:
      - "v*"          # build on every version tag, e.g. v1.1.0
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: write      # needed to attach the exe to a release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build Raqeeb
        run: go build -o raqeeb-The.muslim.shield.exe .

      # --- Optional: sign the binary so Windows trusts it -------------------
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: <your-signpath-org-id>
      #     project-slug: raqeeb
      #     signing-policy-slug: release-signing
      #     artifact-configuration-slug: exe
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      # ----------------------------------------------------------------------

      - name: Upload build artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: raqeeb-windows
          path: raqeeb-The.muslim.shield.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: raqeeb-The.muslim.shield.exe
